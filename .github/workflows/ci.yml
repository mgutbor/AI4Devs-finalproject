name: CI

on:
  pull_request:
    branches: [finalproject-MGB]
  push:
    branches: [finalproject-MGB]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_bpb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_bpb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/ai_bpb?schema=public
      JWT_SECRET: ci-test-only-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 1d
      LLM_PROVIDER: mock
      AI_MOCK_TEMPERATURE: "0.2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and API E2E
        run: npm --workspace backend test -- --testPathIgnorePatterns=database

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Database E2E tests
        run: npm --workspace backend test -- --testPathPattern=database

      - name: Build
        run: npm run build
